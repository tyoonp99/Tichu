services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONHASHSEED: "0"
    command: pytest -q
  train-bc:
    build:
      context: .
      dockerfile: Dockerfile.training
    working_dir: /app
    volumes:
      - .:/app
    shm_size: 1gb
    environment:
      PYTHONHASHSEED: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      PYTHONHASHSEED: "0"
      TICHU_MODEL_CHECKPOINT: /app/models/model-c-v2/model-c.pt
      TICHU_MODEL_DEVICE: cpu
